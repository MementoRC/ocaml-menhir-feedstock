# ocaml is not part of conda-forge's global pinning: conda_build_config.yaml in
# conda-forge-pinning-feedstock contains no ocaml keys at all. compiler("ocaml")
# therefore resolves only because both keys below are declared here. There is no
# global ocaml migration either, so this version is bumped by hand when a new
# ocaml is released.
ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.0"

# menhir builds on windows with compiler("m2w64_c"), i.e. mingw, so the ocaml it
# links against must be the gcc lane of ocaml_win-64. Kept as a variant key
# rather than a literal so that adding a vs2022 lane later is a one-line change
# here instead of an audit of every spec. Deliberately NOT conda-forge's global
# `c_compiler` key: on win-64 that resolves to vs2022, which would pin this
# recipe to the wrong ocaml lane while still building green.
ocaml_toolchain:
  - if: not unix
    then:
      - gcc
