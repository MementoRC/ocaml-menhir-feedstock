# Local override: gives windows x86_64 two toolchain lanes (vs2022/gcc) and win-arm64 a zig lane.
c_compiler:
  - if: not unix and x86_64
    then:
      - vs2022
      - gcc
  - if: not unix and arm64
    then:
      - zig

# DNM: tests ocaml 5.4.1 ahead of the conda-forge migration; drop before merge.
ocaml_compiler_version:
  - 5.4.1
