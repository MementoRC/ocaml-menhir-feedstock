context:
  build_number: 8
  name: ocaml-menhir
  version: "20250912"

  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ "sh" if unix else "bat" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://gitlab.inria.fr/fpottier/menhir/-/archive/${{ version }}/menhir-${{ version }}.tar.gz
    sha256: 26b1f44d6b4ed634631c50866e5535062591308a01a987f415411a9543965c9b

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script: build.sh

requirements:
  build:
    - ${{ compiler("ocaml") }}
    # ocaml_<tp> self-activates for cross builds (toolchain, OCAMLLIB/OCAMLPATH, cross shims on PATH)
    - if: build_platform != target_platform and unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.*
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    # ocaml_win-64 >=14 only run-constrains the C compiler; activate it here, once (vs2022, zig)
    - if: not unix and c_compiler != "gcc"
      then:
        - ${{ compiler("c") }}
    # compiler("ocaml") renders no toolchain track; name it on windows
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    # the cross compiler does not pull the native one; the build runs OCaml on the build machine
    - if: build_platform != target_platform and unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.*
    # windows cross: the self-contained gcc track needs no vcvars
    - if: build_platform != target_platform and not unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.* gcc_*
    - ocaml-dune
    - if: osx
      then:
        - llvm-tools
        - lld
    - if: unix
      then:
        - file
        - sed
    - if: not unix
      then:
        - ${{ m2 }}bash >=5.2
        - ${{ m2 }}coreutils
        - ${{ m2 }}gawk
        - ${{ m2 }}grep
        - ${{ m2 }}sed
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_compiler_version }}.*
    # the noarch ocaml metapackage does not pin the windows toolchain track
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
  # the ocaml run_export does not encode the windows toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

tests:
  # Package contents validation
  - package_contents:
      strict: true
      bin:
        - menhir
      files:
        - ${{ library }}doc/*
        - ${{ library }}lib/ocaml/coq-menhirlib/*
        - ${{ library }}lib/ocaml/menhir/*
        - ${{ library }}lib/ocaml/menhirCST/*
        - ${{ library }}lib/ocaml/menhirLib/*
        - ${{ library }}lib/ocaml/menhirSdk/*
        - ${{ library }}share/man/man1/menhir.1
        - etc/conda/test-files/*

  # Architecture check
  - script: python testing/test-menhir-arch.py
    files:
      recipe:
        - testing/test_utils.py
        - testing/test-menhir-arch.py
    requirements:
      # build-platform python drives the target binary via qemu binfmt on cross
      # lanes (sparse riscv64/s390x subdirs lack python and file)
      build:
        - ${{ m2 }}file
        - python >=3.9

  # Functional tests
  - script: python testing/test-menhir-functional.py
    files:
      recipe:
        - testing/test_utils.py
        - testing/test-menhir-functional.py
    requirements:
      # build-platform python drives the target binary via qemu binfmt on cross
      # lanes (sparse riscv64/s390x subdirs lack python and file)
      build:
        - ${{ m2 }}file
        - python >=3.9
      # menhir --infer runs ocamlc -i
      run:
        - ocaml ${{ ocaml_compiler_version }}.*
        - if: not unix
          then:
            - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

about:
  license: GPL-2.0-only
  license_file: LICENSE
  summary: An LR(1) parser generator for OCaml
  homepage: https://gitlab.inria.fr/fpottier/menhir
  repository: https://gitlab.inria.fr/fpottier/menhir

extra:
  recipe-maintainers:
    - MementoRC
