context:
  build_number: 2
  name: ocaml-menhir
  version: "20250912"

  library: ${{ "Library/" if not unix }}
  m2: ${{ "m2-" if not unix }}
  sh: ${{ "sh" if unix else "bat" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://gitlab.inria.fr/fpottier/menhir/-/archive/${{ version }}/menhir-${{ version }}.tar.gz
    sha256: 26b1f44d6b4ed634631c50866e5535062591308a01a987f415411a9543965c9b

build:
  number: ${{ build_number }}
  script: build.sh

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ${{ m2 }}bash >=5.2
    - ${{ m2 }}gawk
    - ${{ m2 }}grep
    - ${{ m2 }}make
    - ${{ m2 }}sed
    - ocaml-dune
    - if: unix
      then:
        - ${{ compiler("ocaml") }}
      else:
        # compiler("ocaml") expands to `ocaml_<target> <version>.*` with no
        # toolchain track, and ocaml_win-64 publishes gcc_* and vs2022_* at the
        # same version and build number - so the bare form is settled by upload
        # order. Replicate what compiler() emits and add the track.
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ ocaml_toolchain }}_*
    - if: build_platform != target_platform
      then:
        # menhir is a build-time tool: it must RUN on the build machine during
        # a cross build (see recipe/build.sh), so a build-platform ocaml is
        # needed in addition to the cross compiler above.
        - ocaml ${{ ocaml_compiler_version }}.*
        # macOS cross-compilation needs LLVM tools for compatible archives
    - if: osx
      then:
        - llvm-tools
        - lld
    - if: unix
      then:
        - file
    - if: not unix
      then:
        - ${{ m2 }}coreutils
        - ${{ m2 }}diffutils
        - ${{ m2 }}which
  host:
    # menhir ships compiled interfaces (menhirLib, menhirCST, menhirSdk,
    # coq-menhirlib) whose ABI is fixed by the TARGET ocaml, so ocaml belongs
    # here as well as in build: - under cross these are different packages.
    - if: not unix
      then:
        # ocaml_win-64 publishes gcc_* and vs2022_* in the SAME subdir at the
        # same version and build number, so an unqualified spec is settled by
        # the solver, not by this recipe. menhir builds with compiler("m2w64_c"),
        # i.e. mingw, so pin the gcc_ lane. Only windows needs this: the
        # ocaml-feedstock build string injects the toolchain prefix under a
        # `not unix` guard, so every unix subdir is single-lane bare-hash.
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ ocaml_toolchain }}_*
      else:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.*
  run:
    # OCaml interface compatibility is exact-version: a .cmi built against one
    # ocaml minor will not load under another, which surfaces to the end user as
    # "inconsistent assumptions over implementation Stdlib__*". Nothing paired
    # the shipped interfaces with an ocaml at install time before this. The
    # upstream strong_constraints export only constrains the track if ocaml is
    # already installed; menhir needs ocaml present, so this is a dependency.
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ ocaml_toolchain }}_*
      else:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.*
  ignore_run_exports:
    by_name:
      - ocaml
      - ocaml-cross-compilers

tests:
  # Package contents validation
  - package_contents:
      strict: true
      bin:
        - menhir
      files:
        - ${{ library }}doc/*
        - ${{ library }}lib/coq-menhirlib/*
        - ${{ library }}lib/menhir/*
        - ${{ library }}lib/menhirCST/*
        - ${{ library }}lib/menhirLib/*
        - ${{ library }}lib/menhirSdk/*
        - ${{ library }}share/man/man1/menhir.1
        - etc/conda/test-files/*

  # Python-based functional tests (skip arm64 - no emulator on conda-forge)
  - if: not arm64
    then:
      script: |
        python testing/test-menhir-arch.py
        python testing/test-menhir-functional.py
      files:
        recipe:
          - testing/test_utils.py
          - testing/test-menhir-arch.py
          - testing/test-menhir-functional.py
      requirements:
        run:
          - ${{ m2 }}file
          - ocaml
          - python >=3.9

about:
  license: GPL-2.0-only
  license_file: LICENSE
  summary: An LR(1) parser generator for OCaml
  homepage: https://gitlab.inria.fr/fpottier/menhir
  repository: https://gitlab.inria.fr/fpottier/menhir

extra:
  recipe-maintainers:
    - MementoRC
